<!DOCTYPE html>
<html>
<head>
    <title>Employee Management Platform</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:40px;
            background:#f4f4f4;
        }

        h1{
            color:#333;
        }

        table{
            border-collapse: collapse;
            width:60%;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#4CAF50;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }
    </style>

</head>

<body>

<h1>Employee Management Platform</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department</th>
</tr>

{{range .}}

<tr>
    <td>{{.ID}}</td>
    <td>{{.Name}}</td>
    <td>{{.Department}}</td>
</tr>

{{end}}

</table>

</body>

</html>
