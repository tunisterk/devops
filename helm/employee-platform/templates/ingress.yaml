apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-platform
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-web-app
            port:
              number: {{ .Values.gateway.service.port }}
      - path: /employees
        pathType: Prefix
        backend:
          service:
            name: employee-service
            port:
              number: {{ .Values.employeeService.service.port }}